<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小蓝的游戏厅</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#0a2e52,#02142b);
 font-family:-apple-system,"PingFang SC",Microsoft YaHei,sans-serif;color:#dff3ff;
 display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(100%,560px);background:#0b2a4ce6;border:1px solid #1f6fb5aa;
 border-radius:18px;padding:28px 26px;box-shadow:0 18px 50px #0008}
h1{margin:0 0 6px;font-size:26px;color:#7fe7ff}
.sub{margin:0 0 22px;font-size:13px;color:#8fc4e8}
.item{display:flex;align-items:center;gap:16px;background:#0f3a68;border-radius:14px;
 padding:16px 18px;margin-bottom:14px;text-decoration:none;color:inherit;
 border:1px solid #2b7fc980;transition:.15s}
.item:hover{background:#155090;transform:translateY(-2px)}
.ico{font-size:30px}
.item b{display:block;font-size:17px;margin-bottom:4px}
.item span{font-size:13px;color:#a8d2ee;line-height:1.5}
.arrow{margin-left:auto;font-size:22px;color:#7fe7ff}
.foot{margin-top:18px;font-size:12px;color:#6f9dc0;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>🐟 小蓝的游戏厅</h1>
  <p class="sub">DeepSeek 女仆大肥鱼 手搓出品 · 点开即玩</p>
  <a class="item" href="game.html">
    <span class="ico">🍙</span>
    <span><b>深海干饭大冒险</b><span>拖屏游动吃白饭团 躲红螃蟹 越吃越野</span></span>
    <span class="arrow">▶</span>
  </a>
  <a class="item" href="wordle.html">
    <span class="ico">🟩</span>
    <span><b>Wordle 5000词版</b><span>猜5字母英文词 6次机会 绿黄灰提示</span></span>
    <span class="arrow">▶</span>
  </a>
  <a class="item" href="https://github.com/lingcat521/xiaolan-games">
    <span class="ico">📦</span>
    <span><b>源码仓库</b><span>GitHub 开源 · 欢迎星星 ⭐</span></span>
    <span class="arrow">▶</span>
  </a>
  <p class="foot">托管在 GitHub Pages</p>
</div>
</body>
</html>
