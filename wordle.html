<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wordle 5000词版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#02142b;display:flex;flex-direction:column;
 align-items:center;font-family:-apple-system,"PingFang SC",Microsoft YaHei,sans-serif;color:#dff3ff}
h1{margin:18px 0 2px;font-size:24px;color:#7fe7ff}
.sub{font-size:12px;color:#7fa9cb;margin-bottom:14px}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;padding:8px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{width:52px;height:52px;border:2px solid #245a8c;border-radius:7px;
 display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;
 text-transform:uppercase;background:#0a2748;transition:background .18s,border-color .18s}
/* 判色：三种结果各自独立、优先级高于 .cell */
.cell.g{background:#1f9d55 !important;border-color:#157a3f !important;color:#fff}
.cell.y{background:#c9a227 !important;border-color:#a4851c !important;color:#241c00}
.cell.x{background:#2b3f56 !important;border-color:#3d5f80 !important;color:#7d9cbb}
.cell.pop{animation:pop .28s}
@keyframes pop{50%{transform:scale(1.15)}}
#kb{margin-top:14px;width:min(100%,520px);padding:0 6px 16px}
.krow{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
.key{flex:1;max-width:42px;height:52px;border-radius:6px;background:#1c4874;border:0;
 color:#dff3ff;font-size:14px;font-weight:700;cursor:pointer}
.key.wide{max-width:70px;font-size:12px}
.key:active{transform:translateY(2px)}
.key.g{background:#1f9d55;color:#fff}
.key.y{background:#c9a227;color:#241c00}
.key.x{background:#2b3f56;color:#7d9cbb}
#toast{position:fixed;top:46%;left:50%;transform:translateX(-50%);
 background:#04213ff2;border:1px solid #2b7fc9;padding:12px 22px;border-radius:12px;
 font-size:16px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#again{margin:2px 0 16px;border:0;border-radius:999px;padding:11px 30px;font-size:15px;
 font-weight:700;background:linear-gradient(#6ee7ff,#2ea8ff);color:#022;cursor:pointer;display:none}
#stat{font-size:12px;color:#6f9dc0;margin-bottom:14px}
@media(max-width:420px){.cell{width:46px;height:46px;font-size:22px}.key{height:46px}}
</style>
</head>
<body>
<h1>Wordle</h1>
<div class="sub">5字母 · 6次机会 · 词库5000（按词频）· 绿=对位 黄=有这字母 灰=没有</div>
<div id="board"></div>
<div id="stat"></div>
<button id="again">再来一局</button>
<div id="kb"></div>

lby","oswin"];
const R=6,C=5;
let ans="",row=0,cur="",done=false,locked=false,timer=null;
const used={};

const board=document.getElementById('board');
const rows=[];
for(let i=0;i<R;i++){
  const r=document.createElement('div');r.className='row';
  const arr=[];
  for(let j=0;j<C;j++){const c=document.createElement('div');c.className='cell';r.appendChild(c);arr.push(c)}
  rows.push(arr);board.appendChild(r);
}
const kb=document.getElementById('kb');

function judge(a,g){
  const res=Array(5).fill('-'),u=Array(5).fill(false);
  for(let i=0;i<5;i++) if(g[i]===a[i]){res[i]='G';u[i]=true}
  for(let i=0;i<5;i++){
    if(res[i]==='G')continue;
    for(let j=0;j<5;j++) if(!u[j]&&a[j]===g[i]){res[i]='Y';u[j]=true;break}
  }
  return res;
}
const KB=[["q","w","e","r","t","y","u","i","o","p"],
          ["a","s","d","f","g","h","j","k","l"],
          ["ENTER","z","x","c","v","b","n","m","DEL"]];
KB.forEach(kr=>{
  const d=document.createElement('div');d.className='krow';
  kr.forEach(k=>{
    const b=document.createElement('button');
    b.className='key'+(k.length>1?' wide':'');
    b.setAttribute('data-k',k);
    b.textContent=k==='DEL'?'⌫':k==='ENTER'?'ENTER':k;
    b.addEventListener('click',()=>press(k));
    d.appendChild(b);kb.appendChild(d);
  });
});
let tT;
function toast(m){const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');clearTimeout(tT);
  tT=setTimeout(()=>t.classList.remove('on'),1600)}

function paint(){
  const arr=rows[row];
  for(let i=0;i<C;i++){arr[i].textContent=cur[i]||"";arr[i].className='cell'}
}
function shade(ch,cls){
  const btn=kb.querySelector('[data-k="'+ch+'"]');
  if(!btn)return;
  const rank={x:1,y:2,g:3};
  const cur0=used[ch]||'x';
  if(rank[cls]>rank[cur0]){used[ch]=cls;
    btn.classList.remove('g','y','x');btn.classList.add(cls)}
}
function press(k){
  if(done||locked)return;
  if(k==='ENTER'){
    if(cur.length<C){toast('要5个字母呀');return}
    submit();return;
  }
  if(k==='DEL'){cur=cur.slice(0,-1);paint();return}
  if(cur.length<C){cur+=k;paint()}
}
function submit(){
  const guess=cur;
  const res=judge(ans,guess);
  locked=true;                       // ★ 锁定：期间任何输入直接忽略
  const cls=s=>s==='G'?'g':(s==='Y'?'y':'x');
  for(let i=0;i<C;i++){
    (function(i){
      setTimeout(()=>{
        const c=rows[row][i];
        c.classList.add('pop',cls(res[i]));   // ★ 直接加类，不依赖额外变量
      },i*230);
    })(i);
    shade(guess[i],cls(res[i]));
  }
  clearTimeout(timer);
  timer=setTimeout(()=>{                       // ★ 动画结束才解锁/翻行
    if(guess===ans){
      done=true;
      toast(['一发入魂！','2次！厉害','3次 挺稳','4次 不错','5次 险过','6次 压哨！'][row]||'中了');
      end(true);
    }else if(row===R-1){
      done=true;toast('答案是 '+ans);end(false);
    }
    row++;cur='';locked=false;
    updateStat();
    if(!done)paint();
  },C*230+200);
}
function end(){document.getElementById('again').style.display='block'}
function updateStat(){
  document.getElementById('stat').textContent=
    '第 '+(row+1)+'/'+R+' 答案字母数 5'+(done?' · 已结束':'');
}
document.getElementById('again').addEventListener('click',newGame);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='enter')press('ENTER');
  else if(k==='backspace'){e.preventDefault();press('DEL')}
  else if(/^[a-z]$/.test(k))press(k);
});
function newGame(){
  ans=WORDS[Math.floor(Math.random()*WORDS.length)];
  row=0;cur='';done=false;locked=false;
  clearTimeout(timer);
  for(const k in used)delete used[k];
  rows.forEach(r=>r.forEach(c=>{c.textContent='';c.className='cell'}));
  kb.querySelectorAll('.key').forEach(b=>b.classList.remove('g','y','x'));
  document.getElementById('again').style.display='none';
  updateStat();
}
newGame();
</script>
